<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NY State Educating All Students (EAS) Exam Prep</title>
    <meta name="description" content="NYSTCE Educating All Students (EAS, field 201) exam prep — diverse learners, English language learners, students with disabilities, teacher responsibilities, and school-home relationships, with constructed-response practice." />
    <meta name="theme-color" content="#f5f1e4" />
    <script>
      // Set the saved theme before first paint so the access gate and app
      // load in the right mode with no flash (the app defaults to light).
      try {
        var _s = JSON.parse(localStorage.getItem('eas-201-state-v2') || '{}')
        document.documentElement.dataset.theme = _s.theme === 'dark' ? 'dark' : 'light'
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,900&display=swap" rel="stylesheet" />
    <style>
      html, body { background: #f5f1e4; margin: 0; padding: 0; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #121108; }
      * { box-sizing: border-box; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
